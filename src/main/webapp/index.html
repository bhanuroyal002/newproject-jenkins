<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaMart — Bold Contrast</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================
           ULTRA HIGH CONTRAST DESIGN SYSTEM
           ============================================ */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: #222222;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #999999;
            --accent: #ff3366;
            --accent-hover: #ff1a4a;
            --accent-glow: rgba(255, 51, 102, 0.4);
            --accent-gradient: linear-gradient(135deg, #ff3366, #ff6b35);
            --success: #00ff88;
            --success-bg: #003d2a;
            --error: #ff4444;
            --error-bg: #3d0000;
            --border: #333333;
            --border-light: #444444;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.9);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
            --cart-width: 420px;
        }

        /* Light mode - HIGH CONTRAST */
        body.light {
            --bg-primary: #f5f0eb;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0a0a0a;
            --text-secondary: #222222;
            --text-muted: #555555;
            --border: #cccccc;
            --border-light: #dddddd;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
            --accent: #d62828;
            --accent-hover: #b71c1c;
            --accent-glow: rgba(214, 40, 40, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            font-weight: 500;
        }

        /* ============================================
           BOLD TYPOGRAPHY
           ============================================ */
        h1, h2, h3, h4 {
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        h1 {
            font-size: 4.2rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
        }

        h3 {
            font-size: 1.6rem;
            font-weight: 800;
        }

        /* ============================================
           SCROLL PROGRESS - BOLD
           ============================================ */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: var(--accent-gradient);
            z-index: 10000;
            width: 0%;
            transition: width 0.1s;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ============================================
           HEADER - BOLD GLASS
           ============================================ */
        .header {
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }
        body.light .header {
            background: rgba(245, 240, 235, 0.92);
        }
        .header.scrolled {
            box-shadow: var(--shadow-lg);
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 28px;
        }

        .header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .nav {
            display: flex;
            gap: 32px;
            font-weight: 700;
        }
        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            font-size: 1rem;
            letter-spacing: 0.5px;
            position: relative;
        }
        .nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gradient);
            transition: var(--transition);
        }
        .nav a:hover {
            color: var(--text-primary);
        }
        .nav a:hover::after {
            width: 100%;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 60px;
            padding: 6px 16px 6px 20px;
            min-width: 240px;
            transition: 0.15s;
        }
        .search-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .search-wrap input {
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.95rem;
            padding: 8px 0;
            width: 100%;
            color: var(--text-primary);
            font-weight: 500;
        }
        .search-wrap i {
            color: var(--text-muted);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 60px;
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: var(--transition);
            color: var(--text-primary);
            cursor: pointer;
            position: relative;
            font-weight: 700;
        }
        .icon-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .icon-btn .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            width: 22px;
            height: 22px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* ============================================
           HERO - ULTRA BOLD
           ============================================ */
        .hero {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 70px 50px;
            margin: 28px 0 48px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 48px;
            flex-wrap: wrap;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 60%;
            height: 200%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            flex: 1 1 300px;
        }
        .hero-content .badge {
            display: inline-block;
            background: var(--accent-gradient);
            color: #fff;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .hero-content h1 {
            font-size: 4.2rem;
            font-weight: 900;
            margin-bottom: 16px;
            line-height: 1.05;
        }
        .hero-content h1 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 32px;
            color: var(--text-secondary);
            font-weight: 500;
            max-width: 500px;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            border: none;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 24px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 32px var(--accent-glow);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-primary);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.05);
        }

        .hero-image {
            flex: 1 1 280px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-primary);
            border: 2px solid var(--border);
        }
        .hero-image img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        /* ============================================
           STATS - BOLD NUMBERS
           ============================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 24px;
            margin: 40px 0 32px;
            padding: 40px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 3.2rem;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .stat-label {
            color: var(--text-secondary);
            font-weight: 700;
            margin-top: 6px;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        /* ============================================
           FILTERS - BOLD
           ============================================ */
        .filters-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
            padding: 18px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
        }
        .filter-btn {
            padding: 10px 24px;
            border: 2px solid var(--border);
            border-radius: 60px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.05);
        }
        .filter-btn.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        /* ============================================
           PRODUCT CARDS - BOLD
           ============================================ */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin: 20px 0 48px;
        }

        .product-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            position: relative;
            box-shadow: var(--shadow);
        }
        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }

        .product-card .product-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: var(--accent-gradient);
            color: #fff;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 900;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .product-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background: var(--bg-primary);
            display: block;
            transition: transform 0.4s ease;
            border-bottom: 2px solid var(--border);
        }
        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .product-body {
            padding: 20px 22px 22px;
        }
        .product-title {
            font-weight: 800;
            font-size: 1.15rem;
            margin-bottom: 4px;
        }
        .price-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 8px 0 10px;
        }
        .price-current {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
        }
        .price-old {
            font-size: 1rem;
            text-decoration: line-through;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .btn-add {
            flex: 1;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 60px;
            padding: 12px 0;
            font-weight: 800;
            transition: var(--transition);
            cursor: pointer;
            color: var(--text-primary);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        .btn-add:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-wishlist {
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-primary);
            font-size: 1.1rem;
        }
        .btn-wishlist:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: scale(1.1);
        }
        .btn-wishlist.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ============================================
           FLASH SALE - BOLD
           ============================================ */
        .flash-sale {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 44px;
            margin: 40px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 32px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }
        .flash-sale::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 40%;
            height: 200%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            animation: pulseGlow 4s ease-in-out infinite;
        }
        .flash-sale::after {
            content: '⚡';
            position: absolute;
            bottom: -30px;
            right: -10px;
            font-size: 10rem;
            opacity: 0.05;
        }

        .flash-img {
            flex: 1 1 200px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 2px solid var(--border);
        }
        .flash-img img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .flash-content {
            flex: 2 1 300px;
            position: relative;
            z-index: 1;
        }
        .flash-content h2 {
            font-size: 3rem;
            font-weight: 900;
        }

        .timer {
            display: flex;
            gap: 16px;
            margin: 16px 0 20px;
        }
        .time-block {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            text-align: center;
            border: 2px solid var(--border);
            min-width: 80px;
        }
        .time-block .num {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent);
            display: block;
            line-height: 1;
        }
        .time-block .label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* ============================================
           CART SIDEBAR - BOLD
           ============================================ */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .cart-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: var(--cart-width);
            max-width: 90vw;
            height: 100%;
            background: var(--bg-secondary);
            z-index: 1000;
            padding: 28px;
            transition: right 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            border-left: 2px solid var(--border);
        }
        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }
        .cart-header h2 {
            font-size: 1.6rem;
            font-weight: 900;
        }
        .cart-close {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            padding: 4px 12px;
        }
        .cart-close:hover {
            color: var(--accent);
            transform: rotate(90deg);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
        }
        .cart-item {
            display: flex;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }
        .cart-item-img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            border: 1px solid var(--border);
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-title {
            font-weight: 700;
            font-size: 0.95rem;
        }
        .cart-item-price {
            color: var(--accent);
            font-weight: 800;
        }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }
        .cart-item-qty button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--bg-primary);
            cursor: pointer;
            font-weight: 900;
            transition: var(--transition);
            color: var(--text-primary);
        }
        .cart-item-qty button:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .cart-item-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
            padding: 4px 8px;
        }
        .cart-item-remove:hover {
            color: var(--error);
            transform: scale(1.2);
        }

        .cart-footer {
            padding-top: 16px;
            border-top: 2px solid var(--border);
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 16px;
        }
        .cart-total .total-price {
            color: var(--accent);
            font-size: 1.6rem;
        }
        .cart-empty {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }
        .cart-empty i {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }
        .cart-empty p {
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* ============================================
           TESTIMONIALS - BOLD
           ============================================ */
        .testimonial-carousel {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding: 20px 4px 32px;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }
        .testimonial-carousel::-webkit-scrollbar {
            height: 8px;
        }
        .testimonial-carousel::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 10px;
        }
        .testimonial-carousel::-webkit-scrollbar-thumb {
            background: var(--accent-gradient);
            border-radius: 10px;
        }

        .testimonial-card {
            min-width: 340px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            scroll-snap-align: start;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: var(--shadow);
        }
        .testimonial-card:hover {
            transform: scale(1.03);
            border-color: var(--accent);
            box-shadow: var(--shadow-lg);
        }

        /* ============================================
           NEWSLETTER - BOLD GLASS
           ============================================ */
        .newsletter-glass {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 60px 40px;
            text-align: center;
            margin: 40px 0 20px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }
        .newsletter-glass::before {
